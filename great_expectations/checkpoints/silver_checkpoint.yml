# Silver layer checkpoint
# Run via: python great_expectations/run_validations.py silver
#
# Suites validated:
#   silver_transactions -> main_silver.stg_transactions (dbt view)
#
# When this checkpoint should run:
#   AFTER dbt run --select staging (silver views created)
#   BEFORE dbt run --select marts (gold tables created)
#
# This is the critical gate: if silver data quality fails, gold marts
# are built on bad data. Failing here prevents corrupted KPIs in dashboards.

name: silver_checkpoint
config_version: 1.0
class_name: SimpleCheckpoint
run_name_template: "%Y%m%d-%H%M%S-silver"

validations:
  - batch_request:
      datasource_name: runtime_pandas
      data_connector_name: default_runtime_data_connector_name
      data_asset_name: stg_transactions
      runtime_parameters:
        batch_data: "__loaded_at_runtime__"
      batch_identifiers:
        default_identifier_name: silver_transactions
    expectation_suite_name: silver_transactions
