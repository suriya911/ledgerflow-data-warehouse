# Schema tests for the staging (silver) layer
#
# dbt runs these with: dbt test --select staging
#
# Test types used here:
#   not_null        — column must have no NULLs
#   unique          — column values must be unique across all rows
#   accepted_values — column must only contain the listed values
#   relationships   — FK check: every value in column A must exist in column B

version: 2

models:
  - name: stg_transactions
    description: "Cleaned and typed transaction records from bronze"
    columns:
      - name: transaction_id
        description: "UUID primary key"
        tests:
          - not_null
          - unique
      - name: amount
        tests:
          - not_null
      - name: transaction_type
        tests:
          - not_null
          - accepted_values:
              values: ["DEBIT", "CREDIT", "TRANSFER", "WITHDRAWAL"]
      - name: transaction_status
        tests:
          - accepted_values:
              values: ["COMPLETED", "PENDING", "FAILED", "REVERSED"]
      - name: currency
        tests:
          - accepted_values:
              values: ["USD", "EUR", "GBP"]

  - name: stg_customers
    description: "Cleaned customer records; multiple rows per customer = SCD2 versions"
    columns:
      - name: customer_id
        tests:
          - not_null
      - name: segment
        tests:
          - not_null
          - accepted_values:
              values: ["RETAIL", "PREMIUM", "CORPORATE"]
      - name: kyc_status
        tests:
          - accepted_values:
              values: ["VERIFIED", "PENDING", "FAILED", "EXPIRED"]
      - name: email
        tests:
          - not_null

  - name: stg_accounts
    description: "Cleaned account records"
    columns:
      - name: account_id
        tests:
          - not_null
          - unique
      - name: account_type
        tests:
          - accepted_values:
              values: ["CHECKING", "SAVINGS", "LOAN"]
      - name: customer_id
        tests:
          - not_null

  - name: stg_loans
    description: "Cleaned loan records"
    columns:
      - name: loan_id
        tests:
          - not_null
          - unique
      - name: principal
        tests:
          - not_null
      - name: loan_status
        tests:
          - accepted_values:
              values: ["ACTIVE", "CLOSED", "DEFAULTED", "RESTRUCTURED"]
